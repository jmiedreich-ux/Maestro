[project]
name = "maestro"
version = "0.1.0a1"
description = "Local Python and SQLite foundation for Maestro Alpha"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6.0.2,<7", "PyJWT>=2.7,<3", "cryptography>=41,<44"]


[project.scripts]
maestro = "maestro.cli:main"
maestro-service = "maestro.service.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["maestro*"]

[tool.setuptools.package-data]
maestro = ["**/*.json"]

[tool.setuptools.data-files]
"share/maestro/deploy" = ["deploy/install.py", "deploy/maestro.service", "deploy/README.md"]
