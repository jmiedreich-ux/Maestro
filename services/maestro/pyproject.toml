[project]
name = "maestro"
version = "0.1.0a1"
description = "Local Python and SQLite foundation for Maestro Alpha"
requires-python = ">=3.12"

[project.scripts]
maestro = "maestro.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["maestro*"]
